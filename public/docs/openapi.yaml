openapi: 3.0.3
info:
  title: 'SkinLookBD API Documentation'
  description: 'REST API for the SkinLookBD skincare storefront, admin dashboard, and mobile clients.'
  version: 1.0.0
servers:
  - url: 'http://skinlookserver.test'
tags:
  - name: Account
    description: ''
  - name: 'Admin - Catalog'
    description: "\nRequires the `super-admin` or `catalog-manager` role."
  - name: 'Admin - Customers'
    description: "\nRequires the `super-admin` or `order-manager` role."
  - name: 'Admin - Dashboard'
    description: "\nRequires the `super-admin` or `order-manager` role. \"Revenue\" counts orders in\n`confirmed`, `processing`, `shipped`, or `delivered` status only."
  - name: 'Admin - Inventory'
    description: "\nRequires the `super-admin` or `catalog-manager` role."
  - name: 'Admin - Orders'
    description: "\nRequires the `super-admin` or `order-manager` role."
  - name: 'Admin - Promotions'
    description: "\nRequires the `super-admin` or `catalog-manager` role."
  - name: 'Admin - Reports'
    description: "\nRequires the `super-admin` or `order-manager` role."
  - name: 'Admin - Reviews'
    description: "\nRequires the `super-admin` or `catalog-manager` role."
  - name: 'Admin - Staff'
    description: "\nRequires the `super-admin` role."
  - name: Auth
    description: ''
  - name: Cart
    description: "\nWorks for both guests and authenticated customers. Guests are tracked via an\n`X-Cart-Token` header: send it back on every request once you've received it\nfrom a response, and it merges into the customer's cart automatically on login."
  - name: Catalog
    description: ''
  - name: Checkout
    description: ''
  - name: Orders
    description: ''
  - name: Payments
    description: ''
  - name: Shipping
    description: ''
  - name: Wishlist
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtain a token via <code>POST /api/v1/auth/login</code> or <code>/register</code>, then send it as <code>Authorization: Bearer {token}</code>.'
security:
  -
    default: []
paths:
  /api/v1/me:
    get:
      summary: 'Get current profile'
      operationId: getCurrentProfile
      description: ''
      parameters: []
      responses: {}
      tags:
        - Account
    patch:
      summary: 'Update profile'
      operationId: updateProfile
      description: "Updates name and/or email. Phone number changes go through the OTP\nverification flow instead and are not editable here."
      parameters: []
      responses: {}
      tags:
        - Account
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: zbailey@example.net
  /api/v1/me/addresses:
    get:
      summary: 'List addresses'
      operationId: listAddresses
      description: ''
      parameters: []
      responses: {}
      tags:
        - Account
    post:
      summary: 'Add an address'
      operationId: addAnAddress
      description: ''
      parameters: []
      responses: {}
      tags:
        - Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                  nullable: true
                recipient_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                phone:
                  type: string
                  description: 'Must match the regex /^01[3-9]\d{8}$/.'
                  example: '01864255931'
                address_line1:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: i
                address_line2:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: k
                  nullable: true
                city:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: h
                area:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: w
                  nullable: true
                postal_code:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: aykcmyuwpwlvqwrs
                  nullable: true
                type:
                  type: string
                  description: ''
                  example: billing
                  enum:
                    - shipping
                    - billing
                is_default:
                  type: boolean
                  description: ''
                  example: false
              required:
                - recipient_name
                - phone
                - address_line1
                - city
                - type
  '/api/v1/me/addresses/{id}':
    put:
      summary: 'Update an address'
      operationId: updateAnAddress
      description: ''
      parameters: []
      responses: {}
      tags:
        - Account
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                  nullable: true
                recipient_name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                phone:
                  type: string
                  description: 'Must match the regex /^01[3-9]\d{8}$/.'
                  example: '01864255931'
                address_line1:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: i
                address_line2:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: k
                  nullable: true
                city:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: h
                area:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: w
                  nullable: true
                postal_code:
                  type: string
                  description: 'Must not be greater than 20 characters.'
                  example: aykcmyuwpwlvqwrs
                  nullable: true
                type:
                  type: string
                  description: ''
                  example: billing
                  enum:
                    - shipping
                    - billing
                is_default:
                  type: boolean
                  description: ''
                  example: false
    delete:
      summary: 'Delete an address'
      operationId: deleteAnAddress
      description: ''
      parameters: []
      responses: {}
      tags:
        - Account
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the address.'
        example: 16
        required: true
        schema:
          type: integer
  /api/v1/admin/categories:
    get:
      summary: 'List all categories'
      operationId: listAllCategories
      description: 'Unlike the public endpoint, returns every category regardless of active state.'
      parameters: []
      responses: {}
      tags:
        - 'Admin - Catalog'
    post:
      summary: 'Create a category'
      operationId: createACategory
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Admin - Catalog'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                  nullable: true
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                slug:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                  nullable: true
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                image:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: v
                  nullable: true
                is_active:
                  type: boolean
                  description: ''
                  example: true
              required:
                - name
  '/api/v1/admin/categories/{id}':
    put:
      summary: 'Update a category'
      operationId: updateACategory
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Admin - Catalog'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                parent_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                  nullable: true
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                slug:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                image:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: v
                  nullable: true
                is_active:
                  type: boolean
                  description: ''
                  example: true
    delete:
      summary: 'Delete a category'
      operationId: deleteACategory
      description: 'Fails with a 422 if the category still has products assigned to it.'
      parameters: []
      responses: {}
      tags:
        - 'Admin - Catalog'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the category.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/admin/products:
    get:
      summary: 'List all products'
      operationId: listAllProducts
      description: 'Unlike the public endpoint, returns products of any status (draft/active/archived).'
      parameters: []
      responses: {}
      tags:
        - 'Admin - Catalog'
    post:
      summary: 'Create a product'
      operationId: createAProduct
      description: 'Created with `draft` status by default unless `status` is given.'
      parameters: []
      responses: {}
      tags:
        - 'Admin - Catalog'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                slug:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                  nullable: true
                brand:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: z
                  nullable: true
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                ingredients:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                base_price:
                  type: integer
                  description: 'Must be at least 0.'
                  example: 39
                status:
                  type: string
                  description: ''
                  example: archived
                  enum:
                    - draft
                    - active
                    - archived
                skin_type_ids:
                  type: array
                  description: 'Must match an existing stored value.'
                  example:
                    - 16
                  items:
                    type: integer
              required:
                - category_id
                - name
                - base_price
  '/api/v1/admin/products/{id}':
    get:
      summary: 'Get product detail'
      operationId: getProductDetail
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Admin - Catalog'
    put:
      summary: 'Update a product'
      operationId: updateAProduct
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Admin - Catalog'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                slug:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: g
                brand:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: z
                  nullable: true
                description:
                  type: string
                  description: ''
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                ingredients:
                  type: string
                  description: ''
                  example: architecto
                  nullable: true
                base_price:
                  type: integer
                  description: 'Must be at least 0.'
                  example: 39
                status:
                  type: string
                  description: ''
                  example: active
                  enum:
                    - draft
                    - active
                    - archived
                skin_type_ids:
                  type: array
                  description: 'Must match an existing stored value.'
                  example:
                    - 16
                  items:
                    type: integer
    delete:
      summary: 'Delete a product'
      operationId: deleteAProduct
      description: 'Fails with a 422 if the product has existing orders.'
      parameters: []
      responses: {}
      tags:
        - 'Admin - Catalog'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the product.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/admin/products/{product_id}/variants':
    post:
      summary: 'Add a variant to a product'
      operationId: addAVariantToAProduct
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Admin - Catalog'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                size_label:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                price_override:
                  type: integer
                  description: 'Must be at least 0.'
                  example: 84
                  nullable: true
                stock_quantity:
                  type: integer
                  description: 'Must be at least 0.'
                  example: 12
              required:
                - sku
                - size_label
    parameters:
      -
        in: path
        name: product_id
        description: 'The ID of the product.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/admin/variants/{id}':
    patch:
      summary: 'Update a variant'
      operationId: updateAVariant
      description: "Stock quantity is not editable here — use the inventory adjustment endpoint\nso every stock change is logged."
      parameters: []
      responses: {}
      tags:
        - 'Admin - Catalog'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                size_label:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: 'n'
                price_override:
                  type: integer
                  description: 'Must be at least 0.'
                  example: 84
                  nullable: true
    delete:
      summary: 'Delete a variant'
      operationId: deleteAVariant
      description: 'Fails with a 422 if the variant has existing orders.'
      parameters: []
      responses: {}
      tags:
        - 'Admin - Catalog'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the variant.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/admin/products/{product_id}/images':
    post:
      summary: 'Upload product images'
      operationId: uploadProductImages
      description: "Accepts multiple images in a single request; each is stored on the `public`\ndisk and appended to the product's gallery in order."
      parameters: []
      responses: {}
      tags:
        - 'Admin - Catalog'
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  description: 'Must be an image. Must not be greater than 4096 kilobytes.'
                  items:
                    type: string
                    format: binary
    parameters:
      -
        in: path
        name: product_id
        description: 'The ID of the product.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/v1/admin/products/{product_id}/images/{id}':
    delete:
      summary: 'Delete a product image'
      operationId: deleteAProductImage
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Admin - Catalog'
    parameters:
      -
        in: path
        name: product_id
        description: 'The ID of the product.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: id
        description: 'The ID of the image.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/admin/customers:
    get:
      summary: 'List customers'
      operationId: listCustomers
      description: "Searchable by name/email/phone. Each entry includes order count and lifetime\nvalue (sum of `confirmed`+ order totals)."
      parameters: []
      responses: {}
      tags:
        - 'Admin - Customers'
  '/api/v1/admin/customers/{id}':
    get:
      summary: 'Get customer detail'
      operationId: getCustomerDetail
      description: 'Profile, lifetime value, and full order history.'
      parameters: []
      responses: {}
      tags:
        - 'Admin - Customers'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the customer.'
        example: 1
        required: true
        schema:
          type: integer
  /api/v1/admin/dashboard/summary:
    get:
      summary: Summary
      operationId: summary
      description: "Revenue totals for today/this week/this month, order counts by status, and\na low-stock variant count."
      parameters: []
      responses: {}
      tags:
        - 'Admin - Dashboard'
  /api/v1/admin/dashboard/sales:
    get:
      summary: 'Sales time series'
      operationId: salesTimeSeries
      description: "Daily revenue and order counts over a date range (`from`/`to`, default: last\n30 days)."
      parameters: []
      responses: {}
      tags:
        - 'Admin - Dashboard'
  /api/v1/admin/dashboard/top-products:
    get:
      summary: 'Top products'
      operationId: topProducts
      description: "Best sellers by units sold over an optional date range, limited to `limit`\n(default 10) results."
      parameters: []
      responses: {}
      tags:
        - 'Admin - Dashboard'
  /api/v1/admin/inventory/adjustments:
    post:
      summary: 'Adjust stock'
      operationId: adjustStock
      description: "Applies a positive or negative quantity change to a variant's stock and\nrecords an `InventoryLog` entry. Rejected with a 422 if it would push stock\nbelow zero."
      parameters: []
      responses: {}
      tags:
        - 'Admin - Inventory'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_variant_id:
                  type: integer
                  description: 'Must match an existing stored value.'
                  example: 16
                change_quantity:
                  type: integer
                  description: 'Must not be one of <code>0</code>.'
                  example: 16
                reason:
                  type: string
                  description: ''
                  example: return
                  enum:
                    - restock
                    - adjustment
                    - return
                note:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: 'n'
                  nullable: true
              required:
                - product_variant_id
                - change_quantity
                - reason
  /api/v1/admin/inventory/low-stock:
    get:
      summary: 'Low-stock report'
      operationId: lowStockReport
      description: 'Lists variants at or below a stock threshold (default 5), lowest first.'
      parameters: []
      responses: {}
      tags:
        - 'Admin - Inventory'
  /api/v1/admin/orders:
    get:
      summary: 'List orders'
      operationId: listOrders
      description: 'Filterable by `status`, `user_id`, and a `from`/`to` date range.'
      parameters: []
      responses: {}
      tags:
        - 'Admin - Orders'
  '/api/v1/admin/orders/{order_id}/status':
    patch:
      summary: 'Update order status'
      operationId: updateOrderStatus
      description: "Enforces the lifecycle: `pending` → `confirmed` → `processing` → `shipped` →\n`delivered`, with `cancelled` reachable from any pre-shipped state. Marking an\norder `delivered` also marks a COD payment as `paid`. `returned` is only\nreachable via the refund endpoint."
      parameters: []
      responses: {}
      tags:
        - 'Admin - Orders'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: ''
                  example: shipped
                  enum:
                    - confirmed
                    - processing
                    - shipped
                    - delivered
                    - cancelled
                    - returned
              required:
                - status
    parameters:
      -
        in: path
        name: order_id
        description: 'The ID of the order.'
        example: 16
        required: true
        schema:
          type: integer
  '/api/v1/admin/orders/{order_id}/refund':
    post:
      summary: 'Refund an order'
      operationId: refundAnOrder
      description: "Only allowed when the order has a `confirmed` or `paid` payment and is not\nalready `cancelled`/`returned`. Marks the payment `refunded`, restocks\ninventory, and sets the order status to `returned`."
      parameters: []
      responses: {}
      tags:
        - 'Admin - Orders'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 'Must not be greater than 1000 characters.'
                  example: b
                  nullable: true
    parameters:
      -
        in: path
        name: order_id
        description: 'The ID of the order.'
        example: 16
        required: true
        schema:
          type: integer
  /api/v1/admin/coupons:
    get:
      summary: 'List coupons'
      operationId: listCoupons
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Admin - Promotions'
    post:
      summary: 'Create a coupon'
      operationId: createACoupon
      description: 'The code is normalized to uppercase.'
      parameters: []
      responses: {}
      tags:
        - 'Admin - Promotions'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                discount_type:
                  type: string
                  description: ''
                  example: flat
                  enum:
                    - percent
                    - flat
                discount_value:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 22
                min_order_value:
                  type: integer
                  description: 'Must be at least 0.'
                  example: 84
                max_uses:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 66
                  nullable: true
                max_uses_per_user:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 27
                  nullable: true
                starts_at:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-07-14T13:38:15'
                  nullable: true
                expires_at:
                  type: string
                  description: 'Must be a valid date. Must be a date after <code>starts_at</code>.'
                  example: '2052-08-06'
                  nullable: true
                is_active:
                  type: boolean
                  description: ''
                  example: false
              required:
                - code
                - discount_type
                - discount_value
  '/api/v1/admin/coupons/{id}':
    put:
      summary: 'Update a coupon'
      operationId: updateACoupon
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Admin - Promotions'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                discount_type:
                  type: string
                  description: ''
                  example: percent
                  enum:
                    - percent
                    - flat
                discount_value:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 22
                min_order_value:
                  type: integer
                  description: 'Must be at least 0.'
                  example: 84
                max_uses:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 66
                  nullable: true
                max_uses_per_user:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 27
                  nullable: true
                starts_at:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-07-14T13:38:15'
                  nullable: true
                expires_at:
                  type: string
                  description: 'Must be a valid date. Must be a date after <code>starts_at</code>.'
                  example: '2052-08-06'
                  nullable: true
                is_active:
                  type: boolean
                  description: ''
                  example: false
    delete:
      summary: 'Delete a coupon'
      operationId: deleteACoupon
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Admin - Promotions'
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the coupon.'
        example: 16
        required: true
        schema:
          type: integer
  /api/v1/admin/banners:
    get:
      summary: 'List all banners'
      operationId: listAllBanners
      description: "Unlike the public endpoint, returns every banner regardless of active state\nor date window."
      parameters: []
      responses: {}
      tags:
